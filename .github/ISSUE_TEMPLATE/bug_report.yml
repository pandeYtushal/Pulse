name: Bug report
description: Report a reproducible problem with Pulse.
title: "[Bug]: "
body:
  - type: input
    id: pulse-version
    attributes:
      label: Pulse version
      placeholder: "For example, 0.1.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and build
      placeholder: "For example, Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [x64, ARM64, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: "1. Open …\n2. Click …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact personal details before sharing. Diagnostic output may contain media metadata.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot (optional)
      description: Attach only a sanitized screenshot with private content hidden.
  - type: markdown
    attributes:
      value: >-
        **Do not post notification contents, clipboard contents, passwords, credentials,
        private screenshots, or other personal data.**
